name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/test.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-release
          path: verified/
      - name: Recheck the exact archives immediately before publication
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: python3 Scripts/release_artifacts.py verify-publication verified --version "$APP_VERSION" --commit "$GITHUB_SHA" --ref "$GITHUB_REF"

      - name: Generate release notes
        id: notes
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          VERSION="${APP_VERSION}"
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
          fi

          FEATURES=""
          FIXES=""
          OTHERS=""

          while IFS= read -r line; do
            msg="${line#* }"  # strip short hash
            case "$msg" in
              feat:*|feat\(*) FEATURES="${FEATURES}\n- ${msg}" ;;
              fix:*|fix\(*)   FIXES="${FIXES}\n- ${msg}" ;;
              *)              OTHERS="${OTHERS}\n- ${msg}" ;;
            esac
          done < <(git log --oneline "$RANGE" 2>/dev/null)

          # Markdown code spans must remain literal in generated notes.
          # shellcheck disable=SC2016
          {
            echo 'body<<BODY_EOF'
            echo "## Install"
            echo ""
            echo "### Quick Install (recommended)"
            echo ""
            echo 'Automatically selects the Apple Silicon or Intel build, downloads, unzips, removes quarantine, and moves to `/Applications`. ([view script](https://github.com/WoojinAhn/CursorMeter/blob/'"${GITHUB_REF_NAME}"'/Scripts/install.sh))'
            echo ""
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/WoojinAhn/CursorMeter/${GITHUB_REF_NAME}/Scripts/install.sh | bash"
            echo '```'
            echo ""
            echo "### Manual Install"
            echo "1. Download **CursorMeter-${VERSION}.zip** for Apple Silicon or **CursorMeter-${VERSION}-x86_64.zip** for Intel (macOS 14 or later)."
            echo '2. Download the matching `.zip.sha256` file. Apple Silicon: `shasum -a 256 -c CursorMeter-'"${VERSION}"'.zip.sha256`; Intel: `shasum -a 256 -c CursorMeter-'"${VERSION}"'-x86_64.zip.sha256`.'
            echo "3. Unzip the archive"
            echo '4. Remove quarantine: `xattr -cr CursorMeter.app`'
            echo '5. If upgrading, quit the running app first (menu bar → Quit)'
            echo '6. Move `CursorMeter.app` to `/Applications`'
            echo "7. Launch from Applications or Spotlight"
            echo ""
            echo "---"
            echo ""
            echo "## 설치"
            echo ""
            echo "### 빠른 설치 (권장)"
            echo ""
            echo 'Apple Silicon 또는 Intel 빌드를 자동 선택하고 다운로드, 압축 해제, 격리 해제, `/Applications` 이동을 자동으로 수행합니다. ([스크립트 보기](https://github.com/WoojinAhn/CursorMeter/blob/'"${GITHUB_REF_NAME}"'/Scripts/install.sh))'
            echo ""
            echo '```bash'
            echo "curl -fsSL https://raw.githubusercontent.com/WoojinAhn/CursorMeter/${GITHUB_REF_NAME}/Scripts/install.sh | bash"
            echo '```'
            echo ""
            echo "### 수동 설치"
            echo "1. Apple Silicon은 **CursorMeter-${VERSION}.zip**, Intel은 **CursorMeter-${VERSION}-x86_64.zip** 다운로드 (macOS 14 이상)."
            echo '2. 해당 ZIP의 `.zip.sha256` 파일도 다운로드합니다. Apple Silicon: `shasum -a 256 -c CursorMeter-'"${VERSION}"'.zip.sha256`; Intel: `shasum -a 256 -c CursorMeter-'"${VERSION}"'-x86_64.zip.sha256`.'
            echo "3. 압축 해제"
            echo '4. 격리 해제: `xattr -cr CursorMeter.app`'
            echo '5. 업그레이드 시, 실행 중인 앱 먼저 종료 (메뉴바 → Quit)'
            echo '6. `CursorMeter.app`을 `/Applications`로 이동'
            echo "7. Applications 또는 Spotlight에서 실행"
            echo ""
            echo "---"
            echo ""
            echo "## What's Changed"
            if [ -n "$FEATURES" ]; then
              echo ""
              echo "### New Features"
              echo -e "$FEATURES"
            fi
            if [ -n "$FIXES" ]; then
              echo ""
              echo "### Bug Fixes"
              echo -e "$FIXES"
            fi
            if [ -n "$OTHERS" ]; then
              echo ""
              echo "### Other Changes"
              echo -e "$OTHERS"
            fi
            echo 'BODY_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            verified/CursorMeter-${{ steps.version.outputs.version }}.zip
            verified/CursorMeter-${{ steps.version.outputs.version }}.zip.sha256
            verified/CursorMeter-${{ steps.version.outputs.version }}-x86_64.zip
            verified/CursorMeter-${{ steps.version.outputs.version }}-x86_64.zip.sha256
            verified/build-*.json
            verified/smoke-*.json
          fail_on_unmatched_files: true
          body: ${{ steps.notes.outputs.body }}
